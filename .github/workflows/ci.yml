name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careergraph
          POSTGRES_PASSWORD: careergraph_dev_password
          POSTGRES_DB: careergraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Push Database Schema
        env:
          DATABASE_URL: "postgresql://careergraph:careergraph_dev_password@localhost:5432/careergraph_test"
        run: pnpm db:push

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        env:
          DATABASE_URL: "postgresql://careergraph:careergraph_dev_password@localhost:5432/careergraph_test"
          REDIS_URL: "redis://localhost:6379"
          JWT_ACCESS_SECRET: "ci-test-jwt-access-secret-32-chars-long"
          JWT_REFRESH_SECRET: "ci-test-jwt-refresh-secret-32-chars-long"
          COOKIE_SECRET: "ci-test-cookie-secret-32-chars-long"
        run: pnpm test
