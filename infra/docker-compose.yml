services:
  postgres:
    image: postgres:16-alpine
    container_name: careergraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careergraph
      POSTGRES_PASSWORD: careergraph_dev_password
      POSTGRES_DB: careergraph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careergraph -d careergraph"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careergraph-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: careergraph-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI & HTTP API
    volumes:
      - mailpit_data:/data

  falkordb:
    image: falkordb/falkordb:latest
    container_name: careergraph-falkordb
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - falkordb_data:/data

  minio:
    image: minio/minio:latest
    container_name: careergraph-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: careergraph_minio
      MINIO_ROOT_PASSWORD: careergraph_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
  falkordb_data:
  minio_data:
